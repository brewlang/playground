# Build the playground with the brewlang repo next to it, as in development, and publish it on GitHub Pages
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: playground

      - uses: actions/checkout@v4
        with:
          repository: brewlang/brewlang
          path: brewlang

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build brewlang
        working-directory: brewlang
        run: npm ci && npm run build

      - name: Build the playground
        working-directory: playground
        run: npm ci && npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
