<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brewlang Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&display=swap"
    />
    <script>
      // Apply the saved theme before the first paint, so a dark page never flashes light
      try {
        const theme = localStorage.getItem("brewlang-playground:theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <a href="https://github.com/brewlang/brewlang" class="logo">Brewlang</a>
          <span>Playground</span>
        </div>
        <button type="button" class="btn desktop-only" data-action="examples">Examples<span class="caret">▼</span></button>
        <div class="spacer"></div>
        <button type="button" class="btn-ghost desktop-only" data-action="prompt">Copy prompt for your AI</button>
        <button type="button" class="btn-primary desktop-only" data-action="share">Share</button>
        <button type="button" class="theme-toggle" id="theme" title="Switch theme" aria-label="Switch theme"><span></span></button>
      </header>

      <nav class="tabs" aria-label="View">
        <div class="segmented wide">
          <button type="button" id="tab-code" class="on">Code<span id="badge" class="badge" hidden></span></button>
          <button type="button" id="tab-recipe">Recipe</button>
        </div>
      </nav>

      <main class="panes" data-tab="code">
        <section class="pane code-pane" aria-label="Code">
          <div class="pane-head">
            <span id="file" class="mono muted">recipe.brew</span>
            <span id="status" class="status"></span>
          </div>
          <div id="editor"></div>
          <div class="problems">
            <div class="label">Problems<span id="count" class="mono"></span></div>
            <ul id="problems"></ul>
          </div>
        </section>

        <section class="pane recipe-pane" aria-label="Recipe">
          <div class="pane-head recipe-tools">
            <span class="label desktop-only">Recipe</span>
            <div class="tools">
              <label class="dose">Dose<span class="field"><input id="dose" inputmode="decimal" aria-label="Dose" autocomplete="off" /><span id="dose-unit"></span></span></label>
              <span class="divider"></span>
              <span class="muted desktop-only">Scale</span>
              <div id="scales" class="segmented"></div>
              <span class="divider"></span>
              <span class="muted mobile-only">Units</span>
              <div class="units" title="Display units only. The source keeps the author's units.">
                <div id="weights" class="segmented" aria-label="Weight unit"></div>
                <div id="temps" class="segmented" aria-label="Temperature unit"></div>
              </div>
            </div>
          </div>
          <div class="recipe-scroll">
            <div id="notes" class="notes"></div>
            <div id="recipe"></div>
          </div>
        </section>
      </main>

      <footer class="mobile-actions">
        <button type="button" class="btn" data-action="examples">Examples</button>
        <button type="button" class="btn-ghost" data-action="prompt">AI prompt</button>
        <button type="button" class="btn-primary" data-action="share">Share</button>
      </footer>

      <div id="scrim" class="scrim" hidden></div>

      <div id="examples-menu" class="menu examples-menu" hidden>
        <div class="sheet-handle"></div>
        <div class="sheet-title">Load an example</div>
        <div id="examples" class="menu-list"></div>
      </div>

      <div id="share-menu" class="menu share-menu" hidden>
        <div class="sheet-handle"></div>
        <div class="sheet-title">Share this recipe</div>
        <button type="button" id="copy-link" class="menu-item">
          <strong>Copy link</strong>
          <span class="muted">The recipe lives in the link itself. Nothing is uploaded.</span>
          <span id="share-url" class="url mono"></span>
        </button>
        <div class="menu-rule"></div>
        <button type="button" id="download" class="menu-item">
          <strong>Download image</strong>
          <span class="muted">A 4:5 PNG of this recipe card, sized for Instagram.</span>
        </button>
      </div>

      <div id="toast" class="toast" role="status" hidden></div>
    </div>

    <!-- The shareable image is rendered here, off screen, then saved as a PNG -->
    <div id="export" class="export" aria-hidden="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
